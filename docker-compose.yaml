services:
  supabackup:
    build:
      context: .
      dockerfile: Dockerfile
    image: supabackup:latest
    container_name: supabackup
    restart: unless-stopped
    environment:
      - PUID=568
      - PGID=568
      - TZ=UTC
      - CONFIG_PATH=/etc/supabackup/config.yaml
      - BACKUP_DIR=/backups
      # Database connection secrets (provided via env or *_FILE secret paths)
      # Supabase: Session pooler string on port 5432
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - MYSQL_DB_URL=${MYSQL_DB_URL:-}
      # Optional webhook notification endpoints
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      # TrueNAS SCALE dataset mount for backups
      - /mnt/tank/supabase-backups:/backups
      # Configuration directory
      - ./config.yaml:/etc/supabackup/config.yaml:ro
    healthcheck:
      test: ["CMD", "/bin/supabackup", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
