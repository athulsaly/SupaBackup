services:
  supabackup:
    build:
      context: .
      dockerfile: Dockerfile
    image: supabackup:latest
    container_name: supabackup
    restart: unless-stopped
    environment:
      - PUID=568
      - PGID=568
      - TZ=UTC
      - CONFIG_PATH=/etc/supabackup/config.yaml
      - BACKUP_DIR=/backups
      # Database connection secrets (can also be supplied via *_FILE secret paths)
      # Supabase: Use Session pooler string on port 5432
      - SUPABASE_DB_URL=postgresql://postgres.[PROJECT-REF]:[PASSWORD]@aws-0-us-east-1.pooler.supabase.com:5432/postgres
      - MYSQL_DB_URL=mysql://dbuser:mypassword@mysql.internal:3306/production
      # Optional webhook notification endpoints
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/xxx/yyy/zzz
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/xxx/yyy
    volumes:
      # TrueNAS SCALE dataset mount for backups
      - /mnt/tank/supabase-backups:/backups
      # Configuration directory
      - ./config.yaml:/etc/supabackup/config.yaml:ro
