# SupaBackup Test Configuration for Integration Test Harness
# Aligned with ARCHITECTURE.md (reviewed by CTO) & PRD.md schema
jobs:
  - name: test-postgres
    engine: postgres
    schedule: "* * * * *"
    url_env: TEST_POSTGRES_URL
    retention_days: 14

  - name: test-mysql
    engine: mysql
    schedule: "* * * * *"
    url_env: TEST_MYSQL_URL
    retention_days: 7
