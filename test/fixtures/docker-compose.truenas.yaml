# TrueNAS SCALE "Install via YAML" Reference Compose File
services:
  supabackup:
    image: supabackup:latest
    container_name: supabackup
    restart: unless-stopped
    user: "568:568"
    environment:
      PUID: "568"
      PGID: "568"
      CONFIG_PATH: /etc/supabackup/config.yaml
      BACKUP_DIR: /backups
      # Database connection strings passed securely via environment variables
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      MYSQL_DB_URL: ${MYSQL_DB_URL:-}
    volumes:
      # TrueNAS Host Dataset Bind Mounts
      - /mnt/tank/appdata/supabackup/config.yaml:/etc/supabackup/config.yaml:ro
      - /mnt/tank/supabase-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/run/supabackup/status.json || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
