# TrueNAS SCALE "Install via YAML" Reference Compose File
services:
  supabackup:
    image: ghcr.io/athulsaly/supabackup:latest
    container_name: supabackup
    restart: unless-stopped
    environment:
      - PUID=568
      - PGID=568
      - TZ=UTC
      - CONFIG_PATH=/etc/supabackup/config.yaml
      - BACKUP_DIR=/backups
      # Database connection strings passed securely via environment variables
      - SUPABASE_DB_URL=${SUPABASE_DB_URL:-}
      - MYSQL_DB_URL=${MYSQL_DB_URL:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      # TrueNAS Host Dataset Bind Mounts
      - /mnt/tank/supabase-backups:/backups
      - /mnt/tank/supabase-backups/config/config.yaml:/etc/supabackup/config.yaml:ro
    healthcheck:
      test: ["CMD", "/bin/supabackup", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
